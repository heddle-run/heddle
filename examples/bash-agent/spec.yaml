component_type: Flow
agentspec_version: 26.2.0
id: 6f1a0c92-7d3b-4d51-9f8e-2c4b7a91e0d3
name: bash-agent-flow
description: An agent whose only tool is a shell. Python and Node.js are on PATH inside the sandbox, so it can reach for a real language when the shell runs out.
metadata: {}
inputs: []
outputs: []
start_node:
  $component_ref: start-node-0001
nodes:
  - $component_ref: start-node-0001
  - $component_ref: shell-node-0001
  - $component_ref: end-node-0001
control_flow_connections:
  - component_type: ControlFlowEdge
    id: edge-start-shell
    name: start_to_shell
    metadata: {}
    from_node:
      $component_ref: start-node-0001
    from_branch: null
    to_node:
      $component_ref: shell-node-0001
  - component_type: ControlFlowEdge
    id: edge-shell-end
    name: shell_to_end
    metadata: {}
    from_node:
      $component_ref: shell-node-0001
    from_branch: null
    to_node:
      $component_ref: end-node-0001
data_flow_connections:
  - component_type: DataFlowEdge
    id: data-start-shell
    name: start_task_to_shell
    metadata: {}
    source_node:
      $component_ref: start-node-0001
    source_output: task
    destination_node:
      $component_ref: shell-node-0001
    destination_input: task
  - component_type: DataFlowEdge
    id: data-shell-end
    name: shell_result_to_end
    metadata: {}
    source_node:
      $component_ref: shell-node-0001
    source_output: result
    destination_node:
      $component_ref: end-node-0001
    destination_input: result
$referenced_components:
  start-node-0001:
    component_type: StartNode
    id: start-node-0001
    name: start
    metadata: {}
    inputs: []
    outputs:
      - title: task
        type: string
    branches:
      - next
  shell-node-0001:
    component_type: AgentNode
    id: shell-node-0001
    name: shell
    metadata: {}
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: string
    branches:
      - next
    agent:
      component_type: Agent
      id: shell-agent-0001
      name: bash-agent
      description: An agent with a single shell tool, backed by a sandbox that has Python and Node.js
      metadata: {}
      inputs:
        - title: task
          type: string
      outputs:
        - title: result
          type: string
      llm_config:
        component_type: OpenAiConfig
        id: openai-config-0001
        name: openai-gpt4o
        metadata: {}
        model_id: gpt-4o
        api_key: $OPENAI_API_KEY
        api_type: chat_completions
      system_prompt: |
        You are a shell agent. Your main tool is `bash`: it runs a command through a
        real shell and hands back stdout, stderr, and the exit code. Anything you can
        express as a command, you can do. `present_file` is the second tool, and the
        only way anything you make outlives the run.

        ## What is installed

        - `python3` and `node` are both on PATH. Reach for them whenever the task is
          awkward in shell alone — parsing JSON, arithmetic, anything with structure.
        - Write a script with a heredoc and then run it, rather than fighting quoting
          in a one-liner:

              cat > "$HEDDLE_WORKSPACE/report.py" <<'PY'
              import json, sys
              ...
              PY
              python3 "$HEDDLE_WORKSPACE/report.py"

        ## How the shell behaves

        - Each call is a fresh shell. `cd`, exported variables, and activated
          virtualenvs do not survive to the next call. Chain the steps that depend on
          each other into one command with `&&`, or pass `working_directory`.
        - `$HEDDLE_WORKSPACE` is a scratch directory shared by all your tool calls and
          thrown away when the run ends. When the agent is sandboxed it is the only
          place you can write, so put files you create there. Commands run there by
          default.
        - Commands are killed after 25 seconds. `timeout` can lower that for something
          you expect to be quick, but not raise it — work that needs longer has to be
          split into steps, or backgrounded with `nohup` and polled by a later call.
        - Nothing interactive works: stdin is closed, so editors, REPLs, and prompts
          hang or fail. Pass `-y`/`--yes`, and pipe input in instead of typing it.

        ## Giving the user a file

        The workspace is deleted when the run ends, so a file you leave there is a
        file nobody receives. `present_file` copies one out to a directory the user
        keeps.

        - Present anything the task asked you to produce — a report, a chart, a
          converted file, a script worth keeping — as soon as it is finished.
        - Do not present scratch: intermediate data, logs, or a copy of something the
          user already has. One file the user wanted beats six they have to sort.
        - `name` renames the file on the way out. Use it when the workspace name is
          working shorthand (`out2.csv` → `sales-by-region.csv`).
        - Read the result. On success it carries the path the file now lives at, and
          on failure an `error` saying why — usually that the output directory was not
          granted, which is for the user to fix, not you.
        - Name every presented file and its path in your final answer. A file the user
          does not know about was not delivered.

        ## Rules

        - Read `exit_code` on every call. A zero exit is the only evidence a command
          worked; do not assume it from a plausible-looking stdout.
        - When a command fails, read stderr and fix the command before retrying it.
        - Explore before you change: look at a file before overwriting it.
        - Stay inside the task. Do not delete or modify anything outside
          `$HEDDLE_WORKSPACE` unless the task explicitly asks for it.
        - Finish with a short answer in plain prose: what you ran, what came back,
          what it means. Do not dump raw output the user did not ask for.

        The user's request is: {{task}}
      tools:
        - component_type: ServerTool
          id: tool-bash
          name: bash
          description: "Run a shell command and return its stdout, stderr, and exit code. Runs in $HEDDLE_WORKSPACE unless working_directory is given. python3 and node are on PATH. Each call is a fresh shell, stdin is closed, and commands are killed after timeout seconds (default and maximum 25)."
          metadata: {}
          inputs:
            - title: command
              type: string
            - title: working_directory
              type: string
            - title: timeout
              type: integer
          outputs:
            - title: stdout
              type: string
            - title: stderr
              type: string
            - title: exit_code
              type: integer
        - component_type: ServerTool
          id: tool-present-file
          name: present_file
          description: "Copy a file out of the workspace to a directory the user keeps, and return the path it now lives at. The workspace is deleted when the run ends, so this is the only way a file you produced reaches the user. Optionally rename it with name. Returns an error field when the copy could not be made."
          metadata: {}
          inputs:
            - title: path
              type: string
            - title: name
              type: string
          outputs:
            - title: path
              type: string
            - title: bytes
              type: integer
            - title: error
              type: string
  end-node-0001:
    component_type: EndNode
    id: end-node-0001
    name: end
    metadata: {}
    inputs:
      - title: result
        type: string
    outputs: []
    branches: []
    branch_name: next
