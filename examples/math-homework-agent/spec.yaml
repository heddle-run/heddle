weave: 1
name: math-homework-agent
description: An assistant for helping with math homework.

inputs:
  question: string

tools:
  multiplication_tool:
    description: Tool that allows to compute multiplications
    inputs:
      a: integer
      b: integer
    outputs:
      product: integer

agent:
  model:
    provider: vllm
    # A placeholder, exactly as in Oracle's original: point it at a live
    # vLLM endpoint to run.
    url: LLAMA_PUBLIC_ENDPOINT
    model: meta-llama/Meta-Llama-3.1-8B-Instruct
  tools: [multiplication_tool]
  prompt: |
    You are an assistant for helping with math homework.

    The question: {{inputs.question}}
