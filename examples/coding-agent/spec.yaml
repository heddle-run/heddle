weave: 1
name: coding-agent
description: >
  A coding agent inspired by LangGraph's DeepAgent architecture with file
  operations, search, shell execution, planning, and sub-agent delegation.

inputs:
  task: string

tools:
  read_file:
    description: Read the contents of a file at the given path. Returns the file content as a string.
    inputs:
      path: string
    outputs:
      content: string
  write_file:
    description: >-
      Write content to a file at the given path. Creates parent directories if
      needed. Overwrites existing content. Use this to create new files.
    inputs:
      path: string
      content: string
    outputs:
      result: string
  edit_file:
    description: >-
      Edit an existing file by replacing an exact string match with new
      content. Provide old_string to find (must match exactly including
      whitespace) and new_string to replace it with. If old_string is empty,
      content is appended to the file.
    inputs:
      path: string
      old_string: string
      new_string: string
    outputs:
      result: string
  list_directory:
    description: >-
      List files and directories at the given path. Returns entries with type
      indicators (/ for directories).
    inputs:
      path: string
    outputs:
      entries: string
  search_files:
    description: >-
      Search for files. Use pattern for glob matching (e.g. '**/*.py') and/or
      content_pattern for grep-style regex search within files. Searches from
      the given path directory.
    inputs:
      path: string
      pattern: { type: string, default: "" }
      content_pattern: { type: string, default: "" }
    outputs:
      results: string
  execute_command:
    description: >-
      Execute a shell command and return its output. Use for running tests,
      builds, git commands, etc. Commands have a 25-second timeout.
    inputs:
      command: string
      working_directory: { type: string, default: "." }
    outputs:
      stdout: string
      stderr: string
      exit_code: integer
  write_plan:
    description: >-
      Write or update a task plan. Creates a .plan.md file in the working
      directory. Use markdown checkboxes: - [ ] todo, - [x] done.
    inputs:
      plan: string
      working_directory: { type: string, default: "." }
    outputs:
      result: string
  delegate_task:
    description: >-
      Delegate a task to a specialized sub-agent. Available agents:
      code_reviewer (reviews code for bugs, security, style), test_writer
      (generates test cases). The sub-agent runs as an independent heddle flow.
    inputs:
      agent_name: string
      task: string
    outputs:
      result: string

steps:
  - name: coder
    agent:
      model:
        provider: openai
        model: gpt-4o
        api_key: $OPENAI_API_KEY
      tools:
        - read_file
        - write_file
        - edit_file
        - list_directory
        - search_files
        - execute_command
        - write_plan
        - delegate_task
      prompt: |
        You are a coding agent that helps users with software engineering tasks by reading, understanding, modifying, and creating code.

        ## How you work

        1. **Understand first.** Before making changes, explore the codebase. Use list_directory and search_files to discover structure, then read_file to examine specific files.

        2. **Plan before acting.** For non-trivial tasks, use write_plan to create a step-by-step plan with checkboxes. Update it as you progress.

        3. **Make targeted changes.** Use edit_file for modifications (exact old_string match). Use write_file only for new files.

        4. **Verify your work.** After changes, use execute_command to run tests or linters.

        5. **Delegate when appropriate.** Use delegate_task to hand off specialized work:
           - "code_reviewer" — for reviewing code quality, bugs, and improvements
           - "test_writer" — for generating test cases for code

        ## Tool guidelines

        - read_file: Always read before editing so you have exact content for old_string.
        - edit_file: old_string must match exactly including whitespace. Keep changes minimal.
        - write_file: Only for new files. For existing files, use edit_file.
        - search_files: Use pattern for file discovery ("**/*.ts"), content_pattern for code search.
        - execute_command: For tests, builds, git, etc. Check exit_code in response. 25s timeout.
        - list_directory: Start here when exploring unfamiliar code.
        - write_plan: Markdown with checkboxes (- [ ] / - [x]).
        - delegate_task: Pass agent_name and a clear task description with relevant context.

        ## Rules

        - Do not make changes you were not asked to make.
        - Preserve existing code style and conventions.
        - If unsure, explain your reasoning before proceeding.

        The user's request is: {{inputs.task}}
