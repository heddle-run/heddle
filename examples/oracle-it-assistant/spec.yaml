# (LICENSE-APACHE or http://www.apache.org/licenses/LICENSE-2.0) or Universal Permissive License
# (UPL) 1.0 (LICENSE-UPL or https://oss.oracle.com/licenses/upl), at your option.
#
# The original looped each specialist back to the orchestrator until the user
# was done. Weave v1 has no backward edges (loops are reserved for a later
# format version), so this conversion is the single-pass core of the same
# design: look the user up, classify the problem, route to one specialist,
# end. The specialists' outputs land in the run's result either way.
#
#   lookup (tool) ──> orchestrator (agent) ──> route (switch) ──┬─> network ──┐
#                                                               ├─> device  ──┼─> done
#                                                               ├─> account ──┘
#                                                               └─> done (unknown topic)

weave: 1
name: oracle-it-assistant
description: Flow of the Oracle IT assistant

inputs:
  username: string
  problem: string

models:
  llama:
    provider: vllm
    # A placeholder, exactly as in Oracle's original: point it at a live
    # vLLM endpoint to run.
    url: LLAMA_PLACEHOLDER_LINK
    model: /storage/models/Llama-3.3-70B-Instruct

tools:
  get_user_information:
    description: Tool that gathers user information based on its username
    inputs:
      username: string
    outputs:
      user_information: string

steps:
  - name: lookup
    tool: get_user_information
    with:
      username: '{{inputs.username}}'

  - name: orchestrator
    agent:
      model: llama
      output:
        topic: string
        conversation_summary: string
      prompt: |
        You are an orchestrator assistant, and you are part of a larger
        assistant called Oracle IT Assistant. You just have to understand the
        topic of the problem, do not try to solve it.

        CONTEXT
        -------

        The information about the user you are talking to is the following (in
        json format):
        ```
        {{lookup.user_information}}
        ```

        The user's message:
        ```
        {{inputs.problem}}
        ```

        TASK
        ----

        Your task is to understand what is the CURRENT problem of the user, and
        based on that, output the topic of the problem.
        Do not resolve the specific problem. Someone else will take care of the
        solution. You just have to understand and output the topic of the
        problem.

        The available problem topics are:
        - network
        - device
        - account
        - unknown

        If the user is done and wants to exit the conversation, output "unknown"
        as topic.

        Another output you should provide is a short summary of the user's
        situation, 2 sentences at most.

        Remember, do NOT try to solve the problem yourself.

  - name: route
    switch: '{{orchestrator.topic}}'
    cases:
      network: network
      device: device
      account: account
    else: done

  - name: network
    then: done
    agent:
      model: llama
      output:
        conversation_summary: string
      prompt: |
        You are an expert assistant, part of the Oracle IT support assistant.
        Your domain of expertise is computer networks.

        Please assist the user in solving his problem.

        Here's a summary of the situation so far:

        {{orchestrator.conversation_summary}}

        You should provide as an output a short summary of the conversation,
        2 sentences at most, alongside your advice to the user. Be always kind
        and nice.

  - name: device
    then: done
    agent:
      model: llama
      output:
        conversation_summary: string
      prompt: |
        You are an expert assistant, part of the Oracle IT support assistant.
        Your domain of expertise is electronic devices.

        Please assist the user in solving his problem.

        Here's a summary of the situation so far:

        {{orchestrator.conversation_summary}}

        You should provide as an output a short summary of the conversation,
        2 sentences at most, alongside your advice to the user. Be always kind
        and nice.

  - name: account
    agent:
      model: llama
      output:
        conversation_summary: string
      prompt: |
        You are an expert assistant, part of the Oracle IT support assistant.
        Your domain of expertise is Oracle account setup.

        Please assist the user in solving his problem.

        Here's a summary of the situation so far:

        {{orchestrator.conversation_summary}}

        You should provide as an output a short summary of the conversation,
        2 sentences at most, alongside your advice to the user. Be always kind
        and nice.
