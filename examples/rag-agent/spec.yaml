weave: 1
name: adaptive-expert-agent
description: An expert assistant whose domain arrives as an input, with one retrieval tool.

inputs:
  domain_of_expertise: string
  request: string

tools:
  rag_tool:
    description: Tool that performs RAG
    inputs:
      query: string
    outputs:
      results:
        type: array
        items: { type: string }

agent:
  model:
    provider: vllm
    # A placeholder, exactly as in Oracle's original: point it at a live
    # vLLM endpoint to run.
    url: LLAMA_PLACEHOLDER_LINK
    model: meta-llama/Meta-Llama-3.1-8B-Instruct
  tools: [rag_tool]
  prompt: |
    You are an expert in {{inputs.domain_of_expertise}}.
    Please help the users with their requests.

    The request: {{inputs.request}}
