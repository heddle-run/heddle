# XcodeGen manifest — `xcodegen generate` writes Heddle.xcodeproj, which is
# not checked in. The macOS app gets away with bare SwiftPM; an iOS app
# bundle does not build without Xcode's build system, so the project file is
# generated rather than maintained.
name: Heddle
options:
  bundleIdPrefix: run.heddle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

# The protocol layer both apps share — frames, reducer, run records — lives
# in apps/HeddleCore; the generated project references it by relative path.
packages:
  HeddleCore:
    path: ../HeddleCore

targets:
  Heddle:
    type: application
    platform: iOS
    sources:
      - Sources/Heddle
    dependencies:
      - package: HeddleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.heddle.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Heddle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # heddle-server speaks plain HTTP — loopback by default, a LAN
        # address when the phone is not the simulator. There is no TLS story
        # server-side yet, so ATS is opened up rather than half-opened.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: >-
          Heddle connects to your heddle-server to run agents.
        # The `.heddle` type, imported (the macOS app's make-app.sh exports
        # the same identifier). A bundle is a gzipped tar, but it conforms to
        # public.data rather than any archive UTI: conforming to
        # public.zip-archive or friends would invite the system to treat it
        # as an archive to unpack instead of a document to open.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: run.heddle.bundle
            UTTypeDescription: Heddle agent bundle
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - heddle
        CFBundleDocumentTypes:
          - CFBundleTypeName: Heddle agent bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - run.heddle.bundle
        # Copy-in on open: the app keeps its own verbatim copy of the
        # archive next to the extraction, so in-place access would add
        # security-scope bookkeeping and no capability.
        LSSupportsOpeningDocumentsInPlace: false

  HeddleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HeddleTests
      # The cross-implementation bundle fixture, shared with HeddleCore's
      # own suite rather than copied into this one.
      - path: ../HeddleCore/Tests/HeddleCoreTests/Fixtures/mini.heddle
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Heddle
      - package: HeddleCore

schemes:
  Heddle:
    build:
      targets:
        Heddle: all
        HeddleTests: [test]
    test:
      targets:
        - HeddleTests
