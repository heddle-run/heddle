name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — package.json's `packageManager` field is the
      # single source of truth. Setting both makes action-setup v4 fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Pack every library/ entry. `heddle bundle` refuses to write an archive
      # whose spec does not parse, whose graph does not hold, or that names a
      # tool nothing carries — so this is what stops heddle.run/library listing
      # a bundle nobody can run. Needs the build above for the CLI.
      - name: Pack the library
        run: node library/build.mjs
