name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      # The library section is generated from library/ at build time, so a new
      # entry is a website change even though nothing under website/ moved.
      - "library/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The workspace build exists here for one artifact: the CLI that
      # library/build.mjs packs the bundles with, below. The site itself is
      # still the npm build under website/.
      - name: Build the CLI
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website
        env:
          # The playground's engine endpoint. NEXT_PUBLIC_* is inlined into the
          # client bundle at build time, so this has to be set here rather than
          # at deploy time — and being public, it belongs in a repository
          # variable rather than a secret. Left unset, the playground builds and
          # renders but reports that no engine is configured.
          NEXT_PUBLIC_HEDDLE_API: ${{ vars.HEDDLE_API_URL }}

          # Where the site links to the playground: https://playground.heddle.run
          # once that hostname is a custom domain on the Pages project below.
          # Same page either way — the export lives at /playground and the
          # Function serves it at the subdomain's root — so leaving this unset
          # is safe: the links stay relative and keep working.
          NEXT_PUBLIC_PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}

      # After the Next build, because `next build` empties out/ first. Each
      # archive lands beside the entry's page — coding-agent/ the page,
      # coding-agent.heddle the bundle — which is what makes the one command
      # the pages show ("npx @heddle-run/cli run https://heddle.run/library/
      # <name>.heddle") resolve to a real file.
      - name: Pack the library into the export
        run: node library/build.mjs --out website/out/library

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned because the action otherwise picks its own default, and it
          # picks one silently: it looks for wrangler in workingDirectory below,
          # website/ does not depend on it — packages/broker holds this
          # repository's only declaration — and the lookup failing is what sends
          # it to an install of its own. Naming the version is the difference
          # between choosing one and being handed whichever the action defaults
          # to on the day.
          wranglerVersion: "4.118.0"
          # NOTE: "specrun" here is the existing Cloudflare Pages project name,
          # not the product name. Renaming it requires creating the project on
          # the Cloudflare side first, so it is deliberately left alone by the
          # heddle rename -- same as the git remote.
          #
          # website/functions is uploaded with the assets: it is the one thing
          # that makes playground.heddle.run serve the playground rather than
          # the front page.
          #
          # The compatibility date the middleware runs on is deliberately not
          # here. `pages deploy` has no --compatibility-date — no version of
          # wrangler does — and passing one is not ignored, it is a hard
          # "Unknown arguments" exit that fails the deploy. For Pages it is a
          # property of the project rather than of a deploy, kept in the
          # project's deployment_configs and read from there by every
          # deployment. Change it with the dashboard or the Pages API:
          #   PATCH /accounts/{account_id}/pages/projects/specrun
          #   {"deployment_configs":{"production":{"compatibility_date":"..."}}}
          command: >-
            pages deploy out
            --project-name specrun
          workingDirectory: website
