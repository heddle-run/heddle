name: Publish images

# The two published images: `heddle`, the CLI, and `heddle-server`.
#
# This runs alongside release.yml rather than inside it. Both fire on a `v*`
# tag, and neither waits for the other: a broken npm publish should not
# withhold an image that built, and a Docker Hub outage should not hold up a
# release. The tag is the shared input, not one job's output.
#
# Requires two secrets and, optionally, one variable:
#   DOCKERHUB_USERNAME    a Docker Hub account with push access
#   DOCKERHUB_TOKEN       an access token for it, not the password
#   DOCKERHUB_NAMESPACE   the org or user to publish under (default: heddle)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One publish at a time per ref. Two runs pushing the same tag would race on
# the manifest, and the loser is not always the older one.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'heddle' }}

jobs:
  publish:
    runs-on: ubuntu-latest

    # A fork has no credentials to publish with, and the failure it would hit
    # is a confusing one. Skip rather than fail.
    if: github.repository == 'heddle-run/heddle'

    permissions:
      contents: read

    strategy:
      # Independent images. One failing to build says nothing about the other,
      # and cancelling its sibling only hides a second failure until the retry.
      fail-fast: false
      matrix:
        include:
          - name: heddle
            dockerfile: Dockerfile
            description: Run Open Agent Specification flows from the command line.
          - name: heddle-server
            dockerfile: packages/server/Dockerfile
            description: HTTP API for the heddle Agent Spec execution engine.

    steps:
      - uses: actions/checkout@v4

      # Both Dockerfiles build on the native platform and copy the result into
      # the target's runtime stage, so emulation covers only the runtime
      # stage's `apt-get` — seconds, not a full TypeScript build under QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Checked before the login step so a missing secret reads as a missing
      # secret, rather than as an authentication failure against Docker Hub.
      - name: Check credentials
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set on this repository."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` comes from flavor=auto: it follows a release tag and is left
      # alone by a prerelease, so `v0.2.0-beta.1` publishes 0.2.0-beta.1 and
      # nothing else. main publishes `edge` and a sha tag — the sha is what
      # makes an edge image identifiable after the tag has moved on.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.url=https://heddle.run
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repository root for both: the server's Dockerfile reaches
          # across to packages/core and vendor/agentspec.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image so the CLI's layers do not evict the server's.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summarise
        run: |
          {
            echo "### ${{ env.NAMESPACE }}/${{ matrix.name }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
