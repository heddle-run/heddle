name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — package.json's `packageManager` field is the
      # single source of truth. Setting both makes action-setup v4 fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Install with the committed lockfile first, then stamp the version. The
      # tag drives the version: cutting a release is `git tag vX.Y.Z && git push
      # --tags`, with no manual bump and no commit pushed back to a protected
      # branch. Installing before stamping keeps the frozen-lockfile check
      # honest, since bumping the versions afterwards does not touch it.
      - run: pnpm install --frozen-lockfile

      # `pnpm -r publish` reads whatever version each package.json holds here and
      # rewrites `workspace:*` cross-deps to that same concrete version, so every
      # package — the private root included, to keep them in lockstep — is
      # stamped from the tag before anything is built or published. Nothing is
      # committed back; the published artifact carries the tag version, and git
      # tags plus npm remain the record of what shipped.
      - name: Stamp version from tag
        run: |
          pnpm -r --filter './packages/*' exec \
            npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version --allow-same-version
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version --allow-same-version
      - run: pnpm test
      - run: pnpm build

      # Create GitHub Release
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to npm. `pnpm -r publish` walks the workspace in topological
      # order, so @heddle/core goes out before the packages that depend on
      # it. Private packages (the workspace root, vendor/agentspec) are
      # skipped automatically.
      - name: Publish to npm
        run: pnpm -r publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Update Homebrew formula
      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: heddle
          homebrew-tap: spichen/homebrew-tap
          tag-name: ${{ github.ref_name }}
          download-url: https://github.com/heddle-run/heddle/archive/refs/tags/${{ github.ref_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
