# A worked heddle agent: spec + tools + plugin, in the shape most requirements want.
#
#   start ──> triage (Agent + SecretScrub transform) ──> route ──┬─> end_ok
#                                                                └─> end_handoff
#
# Copy this file, rename the nodes, swap the tools, keep the wiring.
# Every id is arbitrary but must be unique and must match the `$component_ref`
# that points at it.
component_type: Flow
agentspec_version: 26.2.0
id: flow_oncall_triage
name: oncall-triage
description: >
  Triages an alert: finds the service's runbook, searches recent logs, and writes
  a triage note. Hands off to a human when the payload names no service.
metadata: {}
inputs: []
outputs: []

start_node:
  $component_ref: n_start
nodes:
  - $component_ref: n_start
  - $component_ref: n_triage
  - $component_ref: n_route
  - $component_ref: n_end_ok
  - $component_ref: n_end_handoff

# Execution order. `from_branch` is null except out of a BranchingNode, where it
# names which branch this edge is.
control_flow_connections:
  - component_type: ControlFlowEdge
    id: e_start_triage
    name: start_to_triage
    metadata: {}
    from_node: { $component_ref: n_start }
    from_branch: null
    to_node: { $component_ref: n_triage }
  - component_type: ControlFlowEdge
    id: e_triage_route
    name: triage_to_route
    metadata: {}
    from_node: { $component_ref: n_triage }
    from_branch: null
    to_node: { $component_ref: n_route }
  - component_type: ControlFlowEdge
    id: e_route_ok
    name: route_to_end_ok
    metadata: {}
    from_node: { $component_ref: n_route }
    from_branch: ok_branch
    to_node: { $component_ref: n_end_ok }
  - component_type: ControlFlowEdge
    id: e_route_handoff
    name: route_to_end_handoff
    metadata: {}
    from_node: { $component_ref: n_route }
    from_branch: handoff_branch
    to_node: { $component_ref: n_end_handoff }

# Data passing. `source_output` must be a key the source node actually writes:
# an Agent writes `result` (plus JSON keys from its answer) and, with transforms
# installed, `transform_status`. Naming a key the node does not write is not an
# error at run time — the destination simply never receives it.
data_flow_connections:
  - component_type: DataFlowEdge
    id: e_alert
    name: alert_to_triage
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: alert
    destination_node: { $component_ref: n_triage }
    destination_input: alert
  - component_type: DataFlowEdge
    id: e_service
    name: service_to_triage
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: service
    destination_node: { $component_ref: n_triage }
    destination_input: service
  - component_type: DataFlowEdge
    id: e_status
    name: status_to_route
    metadata: {}
    source_node: { $component_ref: n_triage }
    source_output: transform_status
    destination_node: { $component_ref: n_route }
    destination_input: branching_mapping_key

$referenced_components:
  n_start:
    component_type: StartNode
    id: n_start
    name: start
    metadata: {}
    inputs: []
    outputs:
      - { title: alert, type: string }
      - { title: service, type: string }
    branches: [next]

  n_triage:
    component_type: AgentNode
    id: n_triage
    name: triage
    metadata: {}
    inputs:
      - { title: alert, type: string }
      - { title: service, type: string }
    outputs:
      # `result` is what an agent always writes. `transform_status` appears
      # because this agent carries transforms.
      - { title: result, type: string }
      - { title: transform_status, type: string }
    branches: [next]
    agent:
      component_type: Agent
      id: a_triage
      name: oncall-triage-agent
      description: On-call triage agent with a runbook lookup and a log search
      metadata: {}
      inputs:
        - { title: alert, type: string }
        - { title: service, type: string }
      outputs:
        - { title: result, type: string }
      # {{alert}} and {{service}} are substituted from the node's input state.
      # A placeholder whose key never arrives is left in the prompt verbatim —
      # `driver.mjs run` fails the run when it sees one.
      system_prompt: |
        You are an on-call triage assistant. Work the alert below and produce a
        short triage note.

        1. Call runbook_lookup for the named service. If no runbook is found, say
           so plainly rather than inventing steps.
        2. Call log_search with a pattern drawn from the alert to see what the
           service was doing.
        3. Answer with: what is broken, the evidence you found, and the first
           action from the runbook. Three sentences, no preamble.

        Service: {{service}}
        Alert: {{alert}}
      llm_config:
        component_type: OpenAiConfig
        id: llm_openai
        name: gpt
        metadata: {}
        model_id: gpt-4o-mini
        api_key: $OPENAI_API_KEY
      tools:
        # A tool is matched to an executable in --tools-dir by name: `name` is the
        # filename with the extension stripped. `description` is what the model
        # reads. An input with no `default` is reported to the model as required.
        - component_type: ServerTool
          id: t_runbook
          name: runbook_lookup
          description: >
            Look up the operational runbook for a service. Returns found=false
            when the service has no runbook, in which case say so.
          metadata: {}
          inputs:
            - { title: service, type: string }
          outputs:
            - { title: found, type: boolean }
            - { title: runbook, type: string }
        - component_type: ServerTool
          id: t_logs
          name: log_search
          description: >
            Search recent log lines for a regular expression. Returns the
            matching lines and how many there were.
          metadata: {}
          inputs:
            - { title: pattern, type: string }
            - title: limit
              type: integer
              # A default makes an input optional; without one heddle tells the
              # model every input is required.
              default: 5
          outputs:
            - { title: matches, type: string }
            - { title: count, type: integer }
      transforms:
        # A plugin component. The type is declared in plugin.mjs and only parses
        # when that plugin is loaded with --plugin.
        - component_type: SecretScrub
          id: p_scrub
          name: secret_scrub
          metadata: {}
          phase: both
          require: [service]
          patterns:
            - 'sk-[A-Za-z0-9]{16,}'
            - '\bAKIA[0-9A-Z]{16}\b'
            # No inline (?i): the plugin compiles these with JS RegExp, which
            # rejects inline flags. Spell the case out instead.
            - '\b[Bb]earer\s+[A-Za-z0-9._-]{12,}'
          replacement: '[REDACTED]'

  n_route:
    component_type: BranchingNode
    id: n_route
    name: route
    metadata: {}
    # A BranchingNode reads `branching_mapping_key` from its input, looks it up
    # in `mapping`, and takes that branch. DEFAULT_BRANCH catches everything else.
    inputs:
      - { title: branching_mapping_key, type: string }
    outputs: []
    branches: [ok_branch, handoff_branch]
    mapping:
      rejected: handoff_branch
      DEFAULT_BRANCH: ok_branch

  n_end_ok:
    component_type: EndNode
    id: n_end_ok
    name: end_ok
    metadata: {}
    inputs:
      - { title: result, type: string }
    outputs: []
    branches: []
    branch_name: ok_branch

  n_end_handoff:
    component_type: EndNode
    id: n_end_handoff
    name: end_handoff
    metadata: {}
    inputs:
      - { title: result, type: string }
    outputs: []
    branches: []
    branch_name: handoff_branch
