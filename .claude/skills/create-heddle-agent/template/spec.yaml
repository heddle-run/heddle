# A worked heddle agent: Weave flow + tools + plugin, in the shape most requirements want.
#
#   triage (agent + SecretScrub transform) ──> route (switch) ──┬─> done
#                                                               └─> handoff
#
# Copy this file, rename the steps, swap the tools, keep the shape. Control
# flows top to bottom: each step runs after the one before it, a `switch` is
# the only fork, and `{{references}}` are the data wiring — there are no ids,
# no edge lists, and no `$component_ref` to keep aligned. Unknown keys are
# errors everywhere except `meta` and a plugin component's own config, so a
# typo fails at load time instead of being carried as decoration.
weave: 1
name: oncall-triage
description: >
  Triages an alert: finds the service's runbook, searches recent logs, and writes
  a triage note. Hands off to a human when the payload names no service.

# What a run must be given: `--input '{"alert": "...", "service": "..."}'`.
# A field with a `default` is optional; without one it is required. The chat
# UI binds each typed message to the FIRST field declared here.
inputs:
  alert: string
  service: string

# Named model configs. `provider` is one of the builtins (openai,
# openai-compatible, ollama, vllm) or a plugin provider type. An `api_key`
# beginning with `$` resolves from the environment on the machine that runs.
models:
  gpt:
    provider: openai
    model: gpt-4o-mini
    api_key: $OPENAI_API_KEY

# Every tool the document uses, declared once, by name. A tool is matched to
# an executable in --tools-dir by name: the filename with the extension
# stripped, so `log_search.sh` is the tool `log_search`. `description` is
# what the model reads to decide whether to call it.
tools:
  runbook_lookup:
    description: >
      Look up the operational runbook for a service. Returns found=false
      when the service has no runbook, in which case say so.
    inputs:
      service: string
    outputs:
      found: boolean
      runbook: string
  log_search:
    description: >
      Search recent log lines for a regular expression. Returns the
      matching lines and how many there were.
    inputs:
      pattern: string
      limit:
        type: integer
        # A default makes an input optional; without one the model is told
        # every input is required.
        default: 5
    outputs:
      matches: string
      count: integer

steps:
  # An agent step: a model with a tool loop. It writes `result` — the model's
  # answer as a string. Declare `output:` with a schema instead and it writes
  # exactly those keys, held to real JSON; there is no in-between where
  # declared outputs exist only on paper. Because this agent carries
  # transforms it also writes `transform_status` (and, on a rejection,
  # `transform_reason`, `transform_name`, `transform_phase`).
  - name: triage
    agent:
      model: gpt              # a name from `models`, or an inline config object
      # {{inputs.alert}} and {{inputs.service}} are resolved at load time:
      # the producer must exist, must write that key, and must run on every
      # path to this step — a reference that cannot be satisfied is a
      # validation error, never a placeholder reaching the model verbatim.
      prompt: |
        You are an on-call triage assistant. Work the alert below and produce a
        short triage note.

        1. Call runbook_lookup for the named service. If no runbook is found, say
           so plainly rather than inventing steps.
        2. Call log_search with a pattern drawn from the alert to see what the
           service was doing.
        3. Answer with: what is broken, the evidence you found, and the first
           action from the runbook. Three sentences, no preamble.

        Service: {{inputs.service}}
        Alert: {{inputs.alert}}
      tools: [runbook_lookup, log_search]   # names from the `tools` map
      transforms:
        # A plugin transform: `use` names the component type plugin.mjs
        # declares, and the remaining keys are that component's config. It
        # only parses when the plugin is loaded with --plugin.
        - use: SecretScrub
          phase: both
          # The agent's user message carries the values its prompt references,
          # keyed by reference — so `require` names them the same way.
          require: [inputs.service]
          patterns:
            - 'sk-[A-Za-z0-9]{16,}'
            - '\bAKIA[0-9A-Z]{16}\b'
            # No inline (?i): the plugin compiles these with JS RegExp, which
            # rejects inline flags. Spell the case out instead.
            - '\b[Bb]earer\s+[A-Za-z0-9._-]{12,}'
          replacement: '[REDACTED]'

  # A switch: the only branching there is. `switch` takes exactly one
  # reference, compared by string equality against the `cases` keys; `else`
  # is required, so every unmatched value has a stated destination. Targets
  # are step or outcome names and must appear LATER in the document —
  # a backward jump is refused (loops are reserved for a later version).
  - name: route
    switch: '{{triage.transform_status}}'
    cases:
      rejected: handoff
    else: done

# Terminal states, and the payload the run returns when it ends in each.
# Payload values are literals or `{{references}}`. Omit the whole block and
# the document gets an implicit `done` echoing the last step's outputs.
outcomes:
  done:
    note: '{{triage.result}}'
  handoff:
    note: '{{triage.result}}'
    reason: needs-human       # literals are fine too
