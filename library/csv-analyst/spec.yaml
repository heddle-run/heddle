# csv-analyst — a question about a spreadsheet, answered with SQL.
#
#   start ──> analyst (Agent + describe_data + run_sql) ──> end
#
# The CSVs arrive as a --mount, so the agent reads whatever landed in data/
# rather than a path baked into the spec. The bundle ships a sample set; your
# own --mount composes with it.
component_type: Flow
agentspec_version: 26.2.0
id: flow_csv_analyst
name: csv-analyst
description: >
  Answers questions about the CSV files mounted at data/ by writing SQL against
  them and reading the rows back.
metadata: {}
inputs: []
outputs: []

start_node:
  $component_ref: n_start
nodes:
  - $component_ref: n_start
  - $component_ref: n_analyst
  - $component_ref: n_end

control_flow_connections:
  - component_type: ControlFlowEdge
    id: e_start_analyst
    name: start_to_analyst
    metadata: {}
    from_node: { $component_ref: n_start }
    from_branch: null
    to_node: { $component_ref: n_analyst }
  - component_type: ControlFlowEdge
    id: e_analyst_end
    name: analyst_to_end
    metadata: {}
    from_node: { $component_ref: n_analyst }
    from_branch: null
    to_node: { $component_ref: n_end }

data_flow_connections:
  - component_type: DataFlowEdge
    id: e_question
    name: question_to_analyst
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: question
    destination_node: { $component_ref: n_analyst }
    destination_input: question
  - component_type: DataFlowEdge
    id: e_result
    name: analyst_to_end_input
    metadata: {}
    source_node: { $component_ref: n_analyst }
    source_output: result
    destination_node: { $component_ref: n_end }
    destination_input: result

$referenced_components:
  n_start:
    component_type: StartNode
    id: n_start
    name: start
    metadata: {}
    inputs: []
    outputs:
      - { title: question, type: string }
    branches: [next]

  n_analyst:
    component_type: AgentNode
    id: n_analyst
    name: analyst
    metadata: {}
    inputs:
      - { title: question, type: string }
    outputs:
      - { title: result, type: string }
    branches: [next]
    agent:
      component_type: Agent
      id: a_analyst
      name: csv-analyst-agent
      description: Answers questions about mounted CSV files by querying them
      metadata: {}
      inputs:
        - { title: question, type: string }
      outputs:
        - { title: result, type: string }
      system_prompt: |
        You answer questions about a set of CSV files by querying them. Every
        CSV mounted at data/ is a table named after its file.

        Question: {{question}}

        1. Call describe_data first, every time. You cannot write a correct
           query against column names you guessed, and the files change between
           runs — this bundle ships a sample set, and whoever runs it may have
           mounted their own alongside.
        2. Write one SELECT and call run_sql. Prefer a query that answers the
           whole question over several that answer parts of it. SQLite dialect.
        3. If run_sql returns an error, read it — it lists the tables that do
           exist — fix the query and try again. Three attempts, then say what
           you could not do.

        Answer with the number or the short table the question asked for, then
        one line on how you got it, then the SQL you ran in a code block. Every
        figure must come from a row run_sql returned. If the data cannot answer
        the question, say so and say what is missing; do not estimate.
      llm_config:
        component_type: OpenAiConfig
        id: llm_openai
        name: gpt
        metadata: {}
        model_id: gpt-4o-mini
        api_key: $OPENAI_API_KEY
      tools:
        - component_type: ServerTool
          id: t_describe
          name: describe_data
          description: >
            List the tables the mounted CSVs became, with their columns, row
            counts and a few sample rows. Call this before writing any query.
          metadata: {}
          inputs: []
          outputs:
            - { title: count, type: integer }
            - { title: tables, type: string }
        - component_type: ServerTool
          id: t_sql
          name: run_sql
          description: >
            Run one SELECT (or WITH ... SELECT) against the mounted CSVs and
            return the rows, up to 200. SQLite dialect. Returns an "error" key
            naming the available tables when the query does not run.
          metadata: {}
          inputs:
            - { title: sql, type: string }
          outputs:
            - { title: columns, type: string }
            - { title: rows, type: string }
            - { title: row_count, type: integer }
      toolboxes: []
      transforms: []

  n_end:
    component_type: EndNode
    id: n_end
    name: end
    metadata: {}
    inputs:
      - { title: result, type: string }
    outputs: []
    branches: []
    branch_name: next
