# docs-qa — a question, answered out of a folder of documents.
#
#   start ──> answerer (Agent + search_docs + read_doc) ──> end
#
# Retrieval with no vector store and no index to build: search finds the lines,
# read fetches the paragraph around them, and the agent cites the file it used.
component_type: Flow
agentspec_version: 26.2.0
id: flow_docs_qa
name: docs-qa
description: >
  Answers a question from the documents mounted at docs/, citing the file and
  line it took each fact from, and says so when the answer is not in them.
metadata: {}
inputs: []
outputs: []

start_node:
  $component_ref: n_start
nodes:
  - $component_ref: n_start
  - $component_ref: n_answerer
  - $component_ref: n_end

control_flow_connections:
  - component_type: ControlFlowEdge
    id: e_start_answerer
    name: start_to_answerer
    metadata: {}
    from_node: { $component_ref: n_start }
    from_branch: null
    to_node: { $component_ref: n_answerer }
  - component_type: ControlFlowEdge
    id: e_answerer_end
    name: answerer_to_end
    metadata: {}
    from_node: { $component_ref: n_answerer }
    from_branch: null
    to_node: { $component_ref: n_end }

data_flow_connections:
  - component_type: DataFlowEdge
    id: e_question
    name: question_to_answerer
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: question
    destination_node: { $component_ref: n_answerer }
    destination_input: question
  - component_type: DataFlowEdge
    id: e_result
    name: answerer_to_end_input
    metadata: {}
    source_node: { $component_ref: n_answerer }
    source_output: result
    destination_node: { $component_ref: n_end }
    destination_input: result

$referenced_components:
  n_start:
    component_type: StartNode
    id: n_start
    name: start
    metadata: {}
    inputs: []
    outputs:
      - { title: question, type: string }
    branches: [next]

  n_answerer:
    component_type: AgentNode
    id: n_answerer
    name: answerer
    metadata: {}
    inputs:
      - { title: question, type: string }
    outputs:
      - { title: result, type: string }
    branches: [next]
    agent:
      component_type: Agent
      id: a_answerer
      name: docs-qa-agent
      description: Answers questions from a mounted corpus of documents
      metadata: {}
      inputs:
        - { title: question, type: string }
      outputs:
        - { title: result, type: string }
      system_prompt: |
        You answer questions from a set of documents mounted at docs/, and from
        nothing else.

        Question: {{question}}

        1. Call search_docs with the words you expect the documents to use, not
           the words the question used. Search again with different terms if the
           first attempt finds little; two or three searches is normal.
        2. Call read_doc on the files worth reading, around the line numbers
           search returned. A matched line is rarely the whole answer.
        3. Answer in a few sentences, and cite each fact as `file.md:line`.

        The documents are the only authority here. Where they are silent, say
        "the documents do not cover this" and name what you searched for —
        answering from what you already know is the one failure this bundle
        exists to avoid. Where they contradict each other, say so and quote
        both.
      llm_config:
        component_type: OpenAiConfig
        id: llm_openai
        name: gpt
        metadata: {}
        model_id: gpt-4o-mini
        api_key: $OPENAI_API_KEY
      tools:
        - component_type: ServerTool
          id: t_search
          name: search_docs
          description: >
            Search the mounted documents for a term or regular expression and
            return matching lines with their file and line number. Case
            insensitive. A query that is not a valid regex is matched literally.
          metadata: {}
          inputs:
            - { title: query, type: string }
            - title: limit
              type: integer
              default: 20
          outputs:
            - { title: count, type: integer }
            - { title: matches, type: string }
        - component_type: ServerTool
          id: t_read
          name: read_doc
          description: >
            Read a window of one mounted document, by the path search_docs
            returned. Defaults to the first 120 lines.
          metadata: {}
          inputs:
            - { title: path, type: string }
            - title: start
              type: integer
              default: 1
            - title: lines
              type: integer
              default: 120
          outputs:
            - { title: text, type: string }
            - { title: total_lines, type: integer }
      toolboxes: []
      transforms: []

  n_end:
    component_type: EndNode
    id: n_end
    name: end
    metadata: {}
    inputs:
      - { title: result, type: string }
    outputs: []
    branches: []
    branch_name: next
