# zoom-notetaker — a Zoom link in, the meeting's notes out. No cloud API.
#
#   start ──> attend (ToolNode) ──> route ──┬─> notes (LlmNode) ──> end
#                                           └─> end_failed
#
# The one ToolNode is the whole trick: `attend` drives a local headless
# Chromium into the meeting through Zoom's web client, records the call's
# audio in the page, and runs it through a speech-to-text model configured
# entirely by env vars (an OpenAI-compatible endpoint, or a local command) —
# or, in captions mode, harvests Zoom's live captions from the DOM instead.
# It is a single step because the browser session has to stay alive from the
# first click to the last word — and it has no decisions in it, so it is a
# plain tool, not an agent. The flow's only branch is the one that matters:
# did a transcript come back or not.
component_type: Flow
agentspec_version: 26.2.0
id: flow_zoom_notetaker
name: zoom-notetaker
description: >
  Sends a headless-browser notetaker into a Zoom meeting, waits for the call
  to end, and turns the captions into a summary, decisions, action items and
  open questions.
metadata: {}
inputs: []
outputs: []

start_node:
  $component_ref: n_start
nodes:
  - $component_ref: n_start
  - $component_ref: n_attend
  - $component_ref: n_route
  - $component_ref: n_notes
  - $component_ref: n_end
  - $component_ref: n_end_failed

control_flow_connections:
  - component_type: ControlFlowEdge
    id: e_start_attend
    name: start_to_attend
    metadata: {}
    from_node: { $component_ref: n_start }
    from_branch: null
    to_node: { $component_ref: n_attend }
  - component_type: ControlFlowEdge
    id: e_attend_route
    name: attend_to_route
    metadata: {}
    from_node: { $component_ref: n_attend }
    from_branch: null
    to_node: { $component_ref: n_route }
  - component_type: ControlFlowEdge
    id: e_route_notes
    name: route_to_notes
    metadata: {}
    from_node: { $component_ref: n_route }
    from_branch: notes_branch
    to_node: { $component_ref: n_notes }
  - component_type: ControlFlowEdge
    id: e_route_failed
    name: route_to_end_failed
    metadata: {}
    from_node: { $component_ref: n_route }
    from_branch: failed_branch
    to_node: { $component_ref: n_end_failed }
  - component_type: ControlFlowEdge
    id: e_notes_end
    name: notes_to_end
    metadata: {}
    from_node: { $component_ref: n_notes }
    from_branch: null
    to_node: { $component_ref: n_end }

data_flow_connections:
  - component_type: DataFlowEdge
    id: e_url
    name: url_to_attend
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: meeting_url
    destination_node: { $component_ref: n_attend }
    destination_input: meeting_url
  - component_type: DataFlowEdge
    id: e_bot_name
    name: bot_name_to_attend
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: bot_name
    destination_node: { $component_ref: n_attend }
    destination_input: bot_name
  - component_type: DataFlowEdge
    id: e_max_wait
    name: max_wait_to_attend
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: max_wait_minutes
    destination_node: { $component_ref: n_attend }
    destination_input: max_wait_minutes
  # `attend` answers outcome=captured or outcome=failed; the branch reads it.
  - component_type: DataFlowEdge
    id: e_outcome
    name: outcome_to_route
    metadata: {}
    source_node: { $component_ref: n_attend }
    source_output: outcome
    destination_node: { $component_ref: n_route }
    destination_input: branching_mapping_key
  - component_type: DataFlowEdge
    id: e_transcript
    name: transcript_to_notes
    metadata: {}
    source_node: { $component_ref: n_attend }
    source_output: transcript
    destination_node: { $component_ref: n_notes }
    destination_input: transcript
  # An LlmNode writes `generated_text` and nothing else, whatever its spec
  # declares. The edge renames it on the way out, so the run's final state
  # reads `notes` rather than the executor's own key.
  - component_type: DataFlowEdge
    id: e_notes
    name: notes_to_end_input
    metadata: {}
    source_node: { $component_ref: n_notes }
    source_output: generated_text
    destination_node: { $component_ref: n_end }
    destination_input: notes
  - component_type: DataFlowEdge
    id: e_error
    name: error_to_end_failed
    metadata: {}
    source_node: { $component_ref: n_attend }
    source_output: error
    destination_node: { $component_ref: n_end_failed }
    destination_input: error

$referenced_components:
  n_start:
    component_type: StartNode
    id: n_start
    name: start
    metadata: {}
    inputs: []
    outputs:
      - { title: meeting_url, type: string }
      - { title: bot_name, type: string }
      - { title: max_wait_minutes, type: integer }
    branches: [next]

  n_attend:
    component_type: ToolNode
    id: n_attend
    name: attend
    metadata: {}
    inputs:
      - { title: meeting_url, type: string }
      - { title: bot_name, type: string }
      - { title: max_wait_minutes, type: integer }
    outputs:
      - { title: outcome, type: string }
      - { title: transcript, type: string }
      - { title: error, type: string }
    branches: [next]
    tool:
      component_type: ServerTool
      id: t_attend
      name: attend_meeting
      description: >
        Join a Zoom meeting in a local headless Chromium via the web client,
        record the call until it ends, and transcribe it with the STT model
        the STT_* env vars configure (or harvest Zoom's live captions when
        ZOOM_TRANSCRIBER=captions). Answers outcome=captured with the
        transcript — or outcome=failed with error saying why: no browser
        found, join refused, no audio, or the transcriber failed.
      metadata: {}
      inputs:
        - { title: meeting_url, type: string }
        - title: bot_name
          type: string
          default: heddle notetaker
        - title: max_wait_minutes
          type: integer
          default: 180
      outputs:
        - { title: outcome, type: string }
        - { title: transcript, type: string }
        - { title: error, type: string }

  n_route:
    component_type: BranchingNode
    id: n_route
    name: route
    metadata: {}
    inputs:
      - { title: branching_mapping_key, type: string }
    outputs: []
    branches: [notes_branch, failed_branch]
    mapping:
      captured: notes_branch
      DEFAULT_BRANCH: failed_branch

  n_notes:
    component_type: LlmNode
    id: n_notes
    name: notes
    metadata: {}
    inputs:
      - { title: transcript, type: string }
    outputs:
      - { title: generated_text, type: string }
    branches: [next]
    llm_config:
      component_type: OpenAiConfig
      id: llm_openai
      name: gpt
      metadata: {}
      model_id: gpt-4o-mini
      api_key: $OPENAI_API_KEY
    prompt_template: |
      You attended a meeting as its notetaker, and the transcript below is
      machine transcription of the call — speech-to-text over the recorded
      audio, or the meeting's live captions. Either way it is rough: names
      come through misspelled, speakers are not always labeled, sentences
      arrive cut in half, lines repeat as the recognizer corrects itself, and
      filler dominates. Write the notes for someone who was not there, under
      exactly these four headings, in this order:

      ## Summary
      Two or three sentences: what the meeting was about and where it landed.

      ## Decisions
      What was actually settled. One line each. If something was discussed but
      not settled, it is not a decision — it is an open question.

      ## Action items
      One line each, in the form `owner — what — by when`. Use the name the
      transcript uses. Write `owner: unassigned` when nobody took it, and
      `by when: not stated` rather than inventing a date.

      ## Open questions
      What was raised and left hanging.

      Quote no more than a short phrase from the transcript. Add nothing that is
      not in it: an empty heading is a correct answer when the meeting produced
      nothing under it.

      Transcript:
      {{transcript}}

  n_end:
    component_type: EndNode
    id: n_end
    name: end
    metadata: {}
    inputs:
      - { title: notes, type: string }
    outputs: []
    branches: []
    branch_name: notes_branch

  n_end_failed:
    component_type: EndNode
    id: n_end_failed
    name: end_failed
    metadata: {}
    inputs:
      - { title: error, type: string }
    outputs: []
    branches: []
    branch_name: failed_branch
