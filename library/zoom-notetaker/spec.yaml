# zoom-notetaker — a Zoom link in, the meeting's notes out.
#
#   start ──> join (ToolNode) ──> capture (ToolNode) ──> route ──┬─> notes (LlmNode) ──> end
#                                                                └─> end_failed
#
# The two ToolNodes are the whole trick: `join` sends a notetaker bot to the
# meeting through the Recall.ai API, `capture` waits until the call ends and
# brings the transcript back, and only then does a model get involved. Neither
# step has a decision in it, so neither is an agent — the flow is a pipeline
# with one branch: did we get a transcript or not.
component_type: Flow
agentspec_version: 26.2.0
id: flow_zoom_notetaker
name: zoom-notetaker
description: >
  Sends a notetaker bot to a Zoom meeting, waits for the call to end, and turns
  what was said into a summary, decisions, action items and open questions.
metadata: {}
inputs: []
outputs: []

start_node:
  $component_ref: n_start
nodes:
  - $component_ref: n_start
  - $component_ref: n_join
  - $component_ref: n_capture
  - $component_ref: n_route
  - $component_ref: n_notes
  - $component_ref: n_end
  - $component_ref: n_end_failed

control_flow_connections:
  - component_type: ControlFlowEdge
    id: e_start_join
    name: start_to_join
    metadata: {}
    from_node: { $component_ref: n_start }
    from_branch: null
    to_node: { $component_ref: n_join }
  - component_type: ControlFlowEdge
    id: e_join_capture
    name: join_to_capture
    metadata: {}
    from_node: { $component_ref: n_join }
    from_branch: null
    to_node: { $component_ref: n_capture }
  - component_type: ControlFlowEdge
    id: e_capture_route
    name: capture_to_route
    metadata: {}
    from_node: { $component_ref: n_capture }
    from_branch: null
    to_node: { $component_ref: n_route }
  - component_type: ControlFlowEdge
    id: e_route_notes
    name: route_to_notes
    metadata: {}
    from_node: { $component_ref: n_route }
    from_branch: notes_branch
    to_node: { $component_ref: n_notes }
  - component_type: ControlFlowEdge
    id: e_route_failed
    name: route_to_end_failed
    metadata: {}
    from_node: { $component_ref: n_route }
    from_branch: failed_branch
    to_node: { $component_ref: n_end_failed }
  - component_type: ControlFlowEdge
    id: e_notes_end
    name: notes_to_end
    metadata: {}
    from_node: { $component_ref: n_notes }
    from_branch: null
    to_node: { $component_ref: n_end }

data_flow_connections:
  - component_type: DataFlowEdge
    id: e_url
    name: url_to_join
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: meeting_url
    destination_node: { $component_ref: n_join }
    destination_input: meeting_url
  - component_type: DataFlowEdge
    id: e_bot_name
    name: bot_name_to_join
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: bot_name
    destination_node: { $component_ref: n_join }
    destination_input: bot_name
  - component_type: DataFlowEdge
    id: e_bot_id
    name: bot_id_to_capture
    metadata: {}
    source_node: { $component_ref: n_join }
    source_output: bot_id
    destination_node: { $component_ref: n_capture }
    destination_input: bot_id
  # When the join fails there is no bot to wait on. Its error rides along so
  # `capture` can fail with the reason the join gave, not a vague one of its own.
  - component_type: DataFlowEdge
    id: e_join_error
    name: join_error_to_capture
    metadata: {}
    source_node: { $component_ref: n_join }
    source_output: error
    destination_node: { $component_ref: n_capture }
    destination_input: join_error
  - component_type: DataFlowEdge
    id: e_max_wait
    name: max_wait_to_capture
    metadata: {}
    source_node: { $component_ref: n_start }
    source_output: max_wait_minutes
    destination_node: { $component_ref: n_capture }
    destination_input: max_wait_minutes
  # `capture` answers outcome=captured or outcome=failed; the branch reads it.
  - component_type: DataFlowEdge
    id: e_outcome
    name: outcome_to_route
    metadata: {}
    source_node: { $component_ref: n_capture }
    source_output: outcome
    destination_node: { $component_ref: n_route }
    destination_input: branching_mapping_key
  - component_type: DataFlowEdge
    id: e_transcript
    name: transcript_to_notes
    metadata: {}
    source_node: { $component_ref: n_capture }
    source_output: transcript
    destination_node: { $component_ref: n_notes }
    destination_input: transcript
  # An LlmNode writes `generated_text` and nothing else, whatever its spec
  # declares. The edge renames it on the way out, so the run's final state
  # reads `notes` rather than the executor's own key.
  - component_type: DataFlowEdge
    id: e_notes
    name: notes_to_end_input
    metadata: {}
    source_node: { $component_ref: n_notes }
    source_output: generated_text
    destination_node: { $component_ref: n_end }
    destination_input: notes
  - component_type: DataFlowEdge
    id: e_error
    name: error_to_end_failed
    metadata: {}
    source_node: { $component_ref: n_capture }
    source_output: error
    destination_node: { $component_ref: n_end_failed }
    destination_input: error

$referenced_components:
  n_start:
    component_type: StartNode
    id: n_start
    name: start
    metadata: {}
    inputs: []
    outputs:
      - { title: meeting_url, type: string }
      - { title: bot_name, type: string }
      - { title: max_wait_minutes, type: integer }
    branches: [next]

  n_join:
    component_type: ToolNode
    id: n_join
    name: join
    metadata: {}
    inputs:
      - { title: meeting_url, type: string }
      - { title: bot_name, type: string }
    outputs:
      - { title: bot_id, type: string }
      - { title: status, type: string }
      - { title: error, type: string }
    branches: [next]
    tool:
      component_type: ServerTool
      id: t_join
      name: join_meeting
      description: >
        Send a notetaker bot to a meeting URL through the Recall.ai API.
        Returns the bot's id, or error set and bot_id empty when the bot could
        not be dispatched.
      metadata: {}
      inputs:
        - { title: meeting_url, type: string }
        - title: bot_name
          type: string
          default: heddle notetaker
      outputs:
        - { title: bot_id, type: string }
        - { title: status, type: string }
        - { title: error, type: string }

  n_capture:
    component_type: ToolNode
    id: n_capture
    name: capture
    metadata: {}
    inputs:
      - { title: bot_id, type: string }
      - { title: join_error, type: string }
      - { title: max_wait_minutes, type: integer }
    outputs:
      - { title: outcome, type: string }
      - { title: transcript, type: string }
      - { title: error, type: string }
    branches: [next]
    tool:
      component_type: ServerTool
      id: t_capture
      name: await_transcript
      description: >
        Wait for the bot's meeting to end, then fetch and flatten its
        transcript. Answers outcome=captured with the transcript, or
        outcome=failed with error saying why — including when the join step
        never produced a bot to wait on.
      metadata: {}
      inputs:
        - title: bot_id
          type: string
          default: ""
        - title: join_error
          type: string
          default: ""
        - title: max_wait_minutes
          type: integer
          default: 180
      outputs:
        - { title: outcome, type: string }
        - { title: transcript, type: string }
        - { title: error, type: string }

  n_route:
    component_type: BranchingNode
    id: n_route
    name: route
    metadata: {}
    inputs:
      - { title: branching_mapping_key, type: string }
    outputs: []
    branches: [notes_branch, failed_branch]
    mapping:
      captured: notes_branch
      DEFAULT_BRANCH: failed_branch

  n_notes:
    component_type: LlmNode
    id: n_notes
    name: notes
    metadata: {}
    inputs:
      - { title: transcript, type: string }
    outputs:
      - { title: generated_text, type: string }
    branches: [next]
    llm_config:
      component_type: OpenAiConfig
      id: llm_openai
      name: gpt
      metadata: {}
      model_id: gpt-4o-mini
      api_key: $OPENAI_API_KEY
    prompt_template: |
      You attended a meeting as its notetaker, and the transcript below is what
      the bot brought back. Machine captions are rough: names come through
      misspelled, sentences arrive cut in half, and filler dominates. Write the
      notes for someone who was not there, under exactly these four headings,
      in this order:

      ## Summary
      Two or three sentences: what the meeting was about and where it landed.

      ## Decisions
      What was actually settled. One line each. If something was discussed but
      not settled, it is not a decision — it is an open question.

      ## Action items
      One line each, in the form `owner — what — by when`. Use the name the
      transcript uses. Write `owner: unassigned` when nobody took it, and
      `by when: not stated` rather than inventing a date.

      ## Open questions
      What was raised and left hanging.

      Quote no more than a short phrase from the transcript. Add nothing that is
      not in it: an empty heading is a correct answer when the meeting produced
      nothing under it.

      Transcript:
      {{transcript}}

  n_end:
    component_type: EndNode
    id: n_end
    name: end
    metadata: {}
    inputs:
      - { title: notes, type: string }
    outputs: []
    branches: []
    branch_name: notes_branch

  n_end_failed:
    component_type: EndNode
    id: n_end_failed
    name: end_failed
    metadata: {}
    inputs:
      - { title: error, type: string }
    outputs: []
    branches: []
    branch_name: failed_branch
